<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Pulse</title>
    <link rel="stylesheet" href="pulse.css" />
    <script src="/_starwright/api.js"></script>
  </head>
  <body>
    <header>
      <h1 id="title">Project Pulse</h1>
      <div class="range" role="group" aria-label="How far back">
        <button data-days="7">7 days</button>
        <button data-days="30">30 days</button>
        <button data-days="90">90 days</button>
      </div>
    </header>
    <p id="status" class="muted">Loading…</p>
    <section class="tiles" id="tiles" aria-label="At a glance"></section>
    <section>
      <h2>Requests each day</h2>
      <div class="chart" id="per-day"></div>
    </section>
    <section>
      <h2>Tokens by agent</h2>
      <p class="muted small">Read (including what came from the cache) and written, for every step of every request.</p>
      <div id="tokens"></div>
    </section>
    <section>
      <h2>Hand-offs</h2>
      <div id="handoffs"></div>
    </section>
    <section>
      <h2>Scheduled runs</h2>
      <div id="schedules"></div>
    </section>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <script src="pulse.js"></script>
  </body>
</html>
